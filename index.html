<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trans-Africa 2026 – route map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ SETTINGS YOU MAY WANT TO CHANGE ============ */
  /* Track colours: older days alternate between two colours, the latest day is highlighted. */
  :root {
    --track-a: #1b4f9c;
    --track-b: #13817d;
    --track-latest: #d9480f;
  }
  /* ======================================================== */
  :root {
    --panel: #ffffff;
    --panel-text: #1d2733;
    --muted: #5b6673;
    --line: #e3e6ea;
    --hover: #f2f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --panel: #1c2128;
      --panel-text: #e8ecf0;
      --muted: #9aa5b1;
      --line: #313842;
      --hover: #262c34;
    }
  }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif; background: #dfe5e8; }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; z-index: 1000;
    top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px;
    width: 300px; max-width: calc(100% - 24px);
    max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column;
    background: var(--panel); color: var(--panel-text);
    border-radius: 10px; box-shadow: 0 2px 14px rgba(20, 30, 45, .25);
    overflow: hidden;
  }
  .panel header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .panel h1 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600;
    font-size: 1.75rem; line-height: 1.05; margin: 0; letter-spacing: .01em;
  }
  .totals { margin: 6px 0 0; font-size: 1rem; color: var(--muted); }
  .totals strong { color: var(--panel-text); font-weight: 500; }
  .toggle {
    margin-top: 10px; display: none; width: 100%;
    font: inherit; font-size: .95rem; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--hover); color: var(--panel-text); cursor: pointer;
  }
  .days { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; }
  .days button {
    display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center;
    width: 100%; padding: 8px 16px; border: 0; background: none; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  .days button:hover, .days button[aria-pressed="true"] { background: var(--hover); }
  .days button:focus-visible, .toggle:focus-visible, .back:focus-visible { outline: 2px solid var(--track-latest); outline-offset: -2px; }
  .swatch { width: 12px; height: 4px; border-radius: 2px; }
  .day-name { font-weight: 500; }
  .day-date { display: block; font-size: .85rem; color: var(--muted); }
  .day-km { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
  .status { padding: 12px 16px; color: var(--muted); font-size: .95rem; }
  .panel footer { padding: 10px 16px; border-top: 1px solid var(--line); font-size: .95rem; }
  .back { color: inherit; }

  @media (max-width: 600px) {
    .panel { width: auto; right: 12px; }
    .toggle { display: block; }
    .panel.collapsed .days, .panel.collapsed footer { display: none; }
  }
  .leaflet-popup-content { font-family: "Barlow", system-ui, sans-serif; font-size: 15px; }
  .leaflet-popup-content b { font-weight: 500; }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Map of the route"></div>

<aside class="panel collapsed" id="panel">
  <header>
    <h1>Trans-Africa 2026</h1>
    <p class="totals" id="totals">Loading the route…</p>
    <button class="toggle" id="toggle" aria-expanded="false">Show all days</button>
  </header>
  <ul class="days" id="days"></ul>
  <footer><a class="back" href="https://transafrica2026.wordpress.com/">Back to the blog</a></footer>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============ SETTINGS ============
   Leave OWNER and REPO empty: they are read from the address
   (https://OWNER.github.io/REPO/). Fill them in only if you use a custom domain. */
const OWNER = "";
const REPO = "";
const BRANCH = "main";
/* GPX files are read from the top level of the repository and from a folder named "gpx". */
/* ================================== */

const owner = OWNER || location.hostname.split(".")[0];
const repo = REPO || location.pathname.split("/").filter(Boolean)[0] || `${owner}.github.io`;

const map = L.map("map", { zoomControl: false, worldCopyJump: true }).setView([20, 15], 3);
L.control.zoom({ position: "bottomright" }).addTo(map);
L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const css = getComputedStyle(document.documentElement);
const color = v => css.getPropertyValue(v).trim();
const panel = document.getElementById("panel");
const toggle = document.getElementById("toggle");
toggle.addEventListener("click", () => {
  const collapsed = panel.classList.toggle("collapsed");
  toggle.setAttribute("aria-expanded", String(!collapsed));
  toggle.textContent = collapsed ? "Show all days" : "Hide the list";
});

function haversine(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function parseGpx(text, fileName) {
  const xml = new DOMParser().parseFromString(text, "application/xml");
  if (xml.getElementsByTagName("parsererror").length) throw new Error("not valid GPX");
  const byTag = (el, tag) => Array.from(el.getElementsByTagNameNS("*", tag));
  const segments = [];
  let start = null, end = null;
  const groups = [...byTag(xml, "trkseg"), ...byTag(xml, "rte")];
  for (const g of groups) {
    const pts = [...byTag(g, "trkpt"), ...byTag(g, "rtept")];
    const seg = [];
    for (const p of pts) {
      const lat = parseFloat(p.getAttribute("lat")), lon = parseFloat(p.getAttribute("lon"));
      if (isNaN(lat) || isNaN(lon)) continue;
      seg.push([lat, lon]);
      const t = byTag(p, "time")[0];
      if (t) { const d = new Date(t.textContent); if (!isNaN(d)) { if (!start) start = d; end = d; } }
    }
    if (seg.length > 1) segments.push(seg);
  }
  if (!segments.length) throw new Error("no track points");
  let km = 0;
  for (const s of segments) for (let i = 1; i < s.length; i++) km += haversine(s[i - 1], s[i]);
  const nameEl = byTag(xml, "trk")[0] && byTag(byTag(xml, "trk")[0], "name")[0];
  const metaName = byTag(xml, "metadata")[0] && byTag(byTag(xml, "metadata")[0], "name")[0];
  let name = (nameEl || metaName)?.textContent.trim() || fileName.replace(/\.gpx$/i, "");
  name = name.replace(/\.gpx$/i, "");
  return { name, fileName, segments, km, start, end };
}

async function listFiles(path) {
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${BRANCH}`;
  const res = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
  if (res.status === 404) return [];
  if (!res.ok) throw new Error(res.status === 403 ? "GitHub is limiting requests right now. Reload the page in a few minutes." : `GitHub answered ${res.status}.`);
  return res.json();
}

async function fetchText(item) {
  // Try the copy on this site first, then the raw file (fresh uploads can take a minute to appear here).
  const local = item.path.split("/").map(encodeURIComponent).join("/");
  for (const url of [local, item.download_url]) {
    try { const r = await fetch(url, { cache: "no-cache" }); if (r.ok) return await r.text(); } catch (e) {}
  }
  throw new Error("could not download");
}

const fmtKm = km => Math.round(km).toLocaleString("en-GB");
const fmtDate = d => d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";

async function main() {
  const totals = document.getElementById("totals");
  const list = document.getElementById("days");
  try {
    const root = await listFiles("");
    let items = root.filter(f => f.type === "file" && /\.gpx$/i.test(f.name));
    if (root.some(f => f.type === "dir" && f.name.toLowerCase() === "gpx")) {
      const sub = await listFiles("gpx");
      items = items.concat(sub.filter(f => f.type === "file" && /\.gpx$/i.test(f.name)));
    }
    if (!items.length) { totals.textContent = "No tracks uploaded yet."; return; }

    const results = await Promise.all(items.map(async it => {
      try { return parseGpx(await fetchText(it), it.name); }
      catch (e) { console.warn(it.name, e); return null; }
    }));
    const days = results.filter(Boolean).sort((a, b) =>
      (a.start && b.start) ? a.start - b.start : a.fileName.localeCompare(b.fileName, undefined, { numeric: true }));
    const skipped = results.length - days.length;

    const all = L.featureGroup().addTo(map);
    let selected = null;
    days.forEach((day, i) => {
      const latest = i === days.length - 1;
      day.color = latest ? color("--track-latest") : (i % 2 ? color("--track-b") : color("--track-a"));
      day.weight = latest ? 5 : 4;
      const popup = `<b>${day.name}</b><br>${fmtDate(day.start)}<br>${fmtKm(day.km)} km`;
      day.layer = L.polyline(day.segments, { color: day.color, weight: day.weight, opacity: .9 })
        .bindPopup(popup).addTo(all);
    });

    const last = days[days.length - 1];
    const lastSeg = last.segments[last.segments.length - 1];
    const lastPt = lastSeg[lastSeg.length - 1];
    L.circleMarker(lastPt, { radius: 8, color: "#fff", weight: 3, fillColor: color("--track-latest"), fillOpacity: 1 })
      .bindPopup(`<b>Last position</b><br>${fmtDate(last.end || last.start)}`).addTo(map);

    map.fitBounds(all.getBounds(), { padding: [30, 30] });

    const total = days.reduce((s, d) => s + d.km, 0);
    totals.innerHTML = `<strong>${days.length}</strong> ${days.length === 1 ? "day" : "days"} on the road, <strong>${fmtKm(total)}</strong> km` +
      (skipped ? `<br>${skipped} file${skipped > 1 ? "s" : ""} could not be read` : "");

    for (const day of [...days].reverse()) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = `<span class="swatch" style="background:${day.color}"></span>
        <span><span class="day-name"></span><span class="day-date">${fmtDate(day.start)}</span></span>
        <span class="day-km">${fmtKm(day.km)} km</span>`;
      b.querySelector(".day-name").textContent = day.name;
      b.addEventListener("click", () => {
        if (selected) { selected.btn.setAttribute("aria-pressed", "false"); selected.layer.setStyle({ weight: selected.weight }); }
        selected = { btn: b, layer: day.layer, weight: day.weight };
        b.setAttribute("aria-pressed", "true");
        day.layer.setStyle({ weight: day.weight + 4 }).bringToFront();
        map.fitBounds(day.layer.getBounds(), { padding: [40, 40] });
        if (matchMedia("(max-width: 600px)").matches) toggle.click();
        day.layer.openPopup(day.layer.getBounds().getCenter());
      });
      li.appendChild(b);
      list.appendChild(li);
    }
  } catch (e) {
    totals.textContent = `The route could not be loaded: ${e.message}`;
  }
}
main();
</script>
</body>
</html>
